{% extends "base.html" %}
{% block title %}
  Подтверждение удаления: {{ object.title }}
{% endblock %}

{% block content %}
  <div class="col d-flex justify-content-center mt-4">
    <div class="card border-danger" style="width: 40rem;">
      <div class="card-body text-center">
        {% if object.image_url %}
          <a href="{{ object.image_url }}" target="_blank">
            <img class="border-3 rounded img-fluid img-thumbnail mb-3 mx-auto d-block" src="{{ object.image_url }}">
          </a>
        {% endif %}

        <h4 class="card-title text-danger">Вы действительно хотите удалить объявление?</h4>
        <p class="card-text"><strong>{{ object.title }}</strong></p>
        <p class="card-text">{{ object.description }}</p>

        <form method="post" class="mt-3">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Подтвердить удаление</button>
          <a href="{% url 'ads:detail_ad' ad_pk=object.pk %}" class="btn btn-secondary ms-2">Отмена</a>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
